<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- Zooming stays allowed (no maximum-scale / user-scalable=no) so text can be enlarged. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Free lessons, quizzes and puzzles for ages 3 to 18. Hints that never give the answer away, a parent PIN, and no ads." />
    <meta name="theme-color" content="#2F6B4F" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Honest Learn" />
    <meta property="og:title" content="Honest Learn: free learning for ages 3 to 18" />
    <meta property="og:description" content="Hints that never give the answer away, a parent PIN, and no ads." />
    <meta name="twitter:card" content="summary" />
    <!-- Installable website: "Add to Home Screen" uses the manifest and icons below. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Honest Learn" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <!-- One typeface for the whole website: Manrope, served from this site (no outside font requests). -->
    <style id="hl-font">
      @font-face { font-family: "Manrope"; font-weight: 400; font-style: normal; font-display: swap; src: url("/fonts/manrope-400.woff2") format("woff2"); }
      @font-face { font-family: "Manrope"; font-weight: 500; font-style: normal; font-display: swap; src: url("/fonts/manrope-500.woff2") format("woff2"); }
      @font-face { font-family: "Manrope"; font-weight: 600 800; font-style: normal; font-display: swap; src: url("/fonts/manrope-600.woff2") format("woff2"); }
      #root, #root * { font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji"; }
      /* keyboard users always see where they are */
      #root [role="button"]:focus-visible, #root [role="switch"]:focus-visible, #root [role="link"]:focus-visible, #root a:focus-visible { outline: 2px solid #1F2430; outline-offset: 2px; }
      #root input:focus-visible, #root textarea:focus-visible { outline: 2px solid #2F6B4F; outline-offset: 1px; }
    </style>
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #fbf8f3;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run Honest Learn. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
