name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  content-and-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Validate lessons, resources and knowledge map
        run: npm run validate
      - name: Knowledge-map document is up to date
        working-directory: .
        run: |
          node scripts/build-knowledge-doc.mjs
          git diff --exit-code docs/KNOWLEDGE_MAP.md || (echo "Run: node scripts/build-knowledge-doc.mjs" && exit 1)
      - name: README catalogue and review sheets are up to date
        working-directory: .
        run: |
          node scripts/build-catalogue.mjs
          node scripts/export-review-sheet.mjs
          git diff --exit-code README.md docs/review || (echo "Run: node scripts/build-catalogue.mjs && node scripts/export-review-sheet.mjs" && exit 1)
      - run: npm run typecheck
      - run: npm test
      - name: Tests on Postgres (PGlite)
        run: npm run test:pg

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - name: Web build
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: https://api.example.org
