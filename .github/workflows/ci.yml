name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  content-and-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Validate lessons, resources and knowledge map
        run: npm run validate
      - name: Document counts match content/
        working-directory: .
        run: node scripts/check-doc-counts.mjs
      - name: Colours are readable (WCAG AA contrast)
        working-directory: .
        run: node scripts/check-contrast.mjs
      - name: Knowledge-map document is up to date
        working-directory: .
        run: |
          node scripts/build-knowledge-doc.mjs
          git diff --exit-code docs/KNOWLEDGE_MAP.md || (echo "Run: node scripts/build-knowledge-doc.mjs" && exit 1)
      - name: README catalogue and review sheets are up to date
        working-directory: .
        run: |
          node scripts/build-catalogue.mjs
          node scripts/export-review-sheet.mjs
          git diff --exit-code README.md docs/review || (echo "Run: node scripts/build-catalogue.mjs && node scripts/export-review-sheet.mjs" && exit 1)
      - name: The phone app's content index is up to date (standalone mode)
        working-directory: .
        run: |
          node scripts/bundle-content.mjs
          git diff --exit-code app/src/local/content-files.generated.ts || (echo "Run: node scripts/bundle-content.mjs" && exit 1)
      - run: npm run typecheck
      - run: npm test
      - name: Tests on Postgres (PGlite)
        run: npm run test:pg
      - name: Tests with the phone app's portable crypto (T8)
        run: npm run test:portable

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            server/package-lock.json
      - run: npm ci
      # the app type-checks and bundles the shared API from ../server/src (standalone mode, task T8)
      - name: Server packages
        run: npm ci --prefix ../server
      - run: npx tsc --noEmit
      - run: npx expo lint
      - name: Web build
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: https://api.example.org
      - name: The shared API runs in the app's own Android bundle, without Node.js (T8a)
        run: npm run proof:local
      - name: Open source notices are up to date and only permissive licences are shipped
        working-directory: .
        run: |
          node scripts/build-licences.mjs
          git diff --exit-code app/src/content/licences.generated.ts THIRD_PARTY_NOTICES.md || (echo "Run: node scripts/build-licences.mjs" && exit 1)
