name: Link and video check

# Report-only: finds dead resource links and unsuitable videos. It never writes back to the repo
# (no --write, read-only token). A human reviewer decides what to fix.
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Free resources and lesson source links respond
        run: node scripts/check-links.mjs
      - name: YouTube videos (only if YOUTUBE_API_KEY is set)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "YOUTUBE_API_KEY secret not set: skipping the video check."
            exit 0
          fi
          node scripts/check-videos.mjs
